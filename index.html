<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<title>خِدمتك – سوريا</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef5f3;color:#172121;font-family:Arial,Tahoma,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#f8faf9;padding-bottom:78px}
header{background:#0f766e;color:#fff;padding:16px;border-radius:0 0 24px 24px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:800}
.free{background:#dff7ef;color:#075e54;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.flag{width:42px;height:28px;border-radius:4px;object-fit:cover;margin-left:8px;vertical-align:middle}
.loc{margin-top:13px;background:#ffffff22;padding:11px;border-radius:14px;display:flex;align-items:center}
.loc button{margin-right:auto;background:none;border:0;color:#fff;font-weight:bold}
.search{display:flex;background:#fff;margin:14px;border:1px solid #dfe8e5;border-radius:16px;padding:4px}
.search input{flex:1;border:0;outline:0;padding:13px;font-size:15px}
.search button{border:0;background:#e9f5f2;border-radius:12px;padding:0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px}
.cat{background:#fff;border:1px solid #e4ebe9;border-radius:15px;padding:10px 4px;font-weight:bold}
.cat span{display:block;font-size:23px;margin-bottom:4px}
.section{padding:0 14px}
.card{background:#fff;border:1px solid #e3ebe8;border-radius:17px;padding:14px;margin:10px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border:0;border-radius:13px;padding:13px;font-weight:bold}
.primary{background:#0f766e;color:#fff}
.light{background:#eaf3f1;color:#155c57}
.muted{color:#71807d;font-size:12px;margin-top:5px}
.provider{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:13px;background:#e6f4f1;display:grid;place-items:center;font-size:21px}
.status{margin-right:auto;background:#e7f7eb;color:#28743d;padding:6px 8px;border-radius:10px;font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}
.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:12px;margin:5px 0;border:1px solid #dce6e3;border-radius:12px;font-family:inherit}
.choice{width:100%;text-align:right;padding:12px;margin:4px 0;background:#fff;border:1px solid #e0e8e6;border-radius:12px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:#fff;border-top:1px solid #dfe7e5;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;color:#687572;font-family:inherit;font-size:11px}
nav b{display:block;font-size:20px}
.active{color:#0f766e!important}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top">
<div class="logo"><img class="flag" src="/flag.svg" alt="علم الثورة السورية">خِدمتك</div>
<div class="free">مجاني أول شهر</div>
</div>
<div class="loc">📍 <span id="place">سوريا</span><button onclick="locations()">تغيير</button></div>
</header>

<div class="search">
<input id="q" placeholder="ابحث: طبيب، صيانة، ماء، عقار..." oninput="filter()">
<button onclick="voice()">🎙️</button>
</div>

<div class="grid">
<button class="cat" data-k="مياه ماء" onclick="report('المياه')"><span>💧</span>المياه</button>
<button class="cat" data-k="كهرباء" onclick="report('الكهرباء')"><span>⚡</span>الكهرباء</button>
<button class="cat" data-k="صيانة فني" onclick="providers('فني')"><span>🛠️</span>الصيانة</button>
<button class="cat" data-k="طبيب صحة" onclick="providers('طبيب')"><span>🏥</span>الصحة</button>
<button class="cat" data-k="نقل تكسي" onclick="providers('نقل')"><span>🚕</span>النقل</button>
<button class="cat" data-k="عقار بيت" onclick="listings()"><span>🏠</span>العقارات</button>
<button class="cat" data-k="سوق بيع" onclick="listings()"><span>🛒</span>السوق</button>
<button class="cat" data-k="عمل وظيفة" onclick="openInfo('العمل')"><span>💼</span>العمل</button>
</div>

<div class="section">
<h3>🚨 تحتاج شيئًا بسرعة؟</h3>
<div class="actions">
<button class="btn primary" onclick="report()">➕ إرسال بلاغ</button>
<button class="btn light" onclick="providers()">🧑‍🔧 اطلب خدمة</button>
</div>

<h3>🌙 خدمات المناوبة</h3>
<div class="card">
<b>طبيب أو صيدلية متاحة الآن</b>
<div class="muted">تظهر هنا الجهات التي أعلنت «متاح الآن» في منطقتك.</div>
<button class="btn primary" style="width:100%;margin-top:10px" onclick="providers('طبيب')">عرض المتاح الآن</button>
</div>

<h3>خِدمتك لكل سوريا</h3>
<div class="card">
<b>اختر محافظتك ثم مدينتك أو قريتك</b>
<div class="muted">الخدمات والبلاغات مرتبطة بالمنطقة المختارة.</div>
</div>

<div id="content"></div>
</div>
</div>

<nav>
<button class="active" onclick="home()"><b>⌂</b>الرئيسية</button>
<button onclick="providers()"><b>⌕</b>الخدمات</button>
<button onclick="listings()"><b>🛒</b>السوق</button>
<button onclick="account()"><b>◉</b>حسابي</button>
</nav>

<div id="modal" class="modal">
<div class="sheet">
<h3 id="mt"></h3>
<div id="mb"></div>
<button class="btn light" style="width:100%;margin-top:8px" onclick="closeM()">إغلاق</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let city='';
const cities=['دمشق','ريف دمشق','حلب','حمص','حماة','اللاذقية','طرطوس','إدلب','دير الزور','الرقة','الحسكة','درعا','السويداء','القنيطرة'];

function openM(t,b){
  $('mt').textContent=t;
  $('mb').innerHTML=b;
  $('modal').style.display='flex';
}

function closeM(){
  $('modal').style.display='none';
}

function locations(){
  openM('📍 اختر محافظتك',cities.map(x=>`<button class="choice" onclick="setCity('${x}')">📍 ${x}</button>`).join(''));
}

function setCity(x){
  city=x;
  $('place').textContent=x;
  closeM();
}

function filter(){
  let q=$('q').value.trim();
  document.querySelectorAll('.cat').forEach(x=>x.style.display=!q||x.dataset.k.includes(q)?'block':'none');
}

function voice(){
  openM('🎙️ البحث بالصوت','<p>يمكن تفعيل البحث الصوتي العربي عند نشر النسخة النهائية مع خدمة التعرف على الكلام.</p>');
}

function report(cat=''){
  openM('🚨 إرسال بلاغ',`<select id="rc"><option>${cat||'المياه'}</option><option>الكهرباء</option><option>الطرق</option><option>الصرف الصحي</option><option>مشكلة أخرى</option></select><input id="ra" placeholder="الحي / القرية"><textarea id="rd" placeholder="اشرح المشكلة"></textarea><input id="rp" placeholder="رقم الهاتف (اختياري)"><button class="btn primary" style="width:100%" onclick="sendReport()">إرسال البلاغ</button>`);
}

async function sendReport(){
  if(!city)return openM('📍 المنطقة مطلوبة','اختر محافظتك أولًا.');
  let r=await api('/api/reports','POST',{category:$('rc').value,description:$('rd').value,city,area:$('ra').value,phone:$('rp').value});
  closeM();
  alert('تم تسجيل البلاغ رقم '+r.id);
}

async function providers(prof=''){
  let a=await api('/api/providers?'+(city?'city='+encodeURIComponent(city)+'&':'')+'available=true');
  if(prof)a=a.filter(x=>x.profession.includes(prof));
  openM('🧑‍🔧 المتاحون الآن',a.length?a.map(p=>`<div class="card provider"><div class="avatar">👤</div><div><b>${p.name}</b><div class="muted">${p.profession} • ${p.city||'سوريا'}</div></div><span class="status">متاح الآن</span></div>`).join(''):'<p>لا توجد جهات أعلنت التوفر الآن في المنطقة.</p>');
}

async function listings(){
  let a=await api('/api/listings'+(city?'?city='+encodeURIComponent(city):''));
  openM('🛒 السوق المحلي',a.length?a.map(x=>`<div class="card"><b>${x.title}</b><div>${x.price||'السعر عند التواصل'}</div><div class="muted">${x.city}</div></div>`).join(''):'<p>لا توجد إعلانات بعد.</p>');
}

function account(){
  openM('👤 حسابي','<input id="un" placeholder="الاسم"><input id="up" placeholder="رقم الهاتف"><button class="btn primary" style="width:100%" onclick="register()">إنشاء حساب</button><p class="muted">يمكن للمحترف إنشاء حساب ثم التحكم بحالة «متاح الآن / مشغول / غير متاح» بعد ربط لوحة الحساب.</p>');
}

async function register(){
  let r=await api('/api/register','POST',{name:$('un').value,phone:$('up').value});
  closeM();
  alert('تم إنشاء الحساب: '+r.name);
}

function openInfo(x){
  openM(x,'<p>الخدمة قيد التوسعة لتشمل الوظائف والخدمات المحلية في جميع المحافظات.</p>');
}

function home(){
  closeM();
}

async function api(u,m='GET',body){
  let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let j=await r.json();
  if(!r.ok)throw new Error(j.error||'خطأ');
  return j;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
